<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 40px;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .card {
            flex: 1;
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            transition: 0.25s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin-bottom: 8px;
        }

        .card p {
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .cards {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Trading Dashboard</h1>
        <p class="subtitle">Your trading workspace</p>

        <div class="cards">

            <a href="Trade_Journal.html" class="card">
                <div class="icon">📊</div>
                <h2>Trade Journal</h2>
                <p>Track and review your trades</p>
            </a>

            <a href="Trade_Plan.html" class="card">
                <div class="icon">📋</div>
                <h2>Trade Plan</h2>
                <p>Review your rules before trading</p>
            </a>

        </div>

    </div>

</body>
</html>
