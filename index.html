<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trading Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: #ffffff;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #d4af37;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 15px;
            margin-bottom: 45px;
        }

        .cards {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .card {
            flex: 1;
            min-height: 210px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: #101010;
            border: 1px solid #d4af37;
            border-radius: 20px;

            text-decoration: none;
            color: #ffffff;

            padding: 30px;

            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);

            background: #141414;

            box-shadow:
                0 0 15px rgba(212, 175, 55, 0.15),
                0 0 35px rgba(212, 175, 55, 0.08);
        }

        .icon {
            font-size: 42px;
            margin-bottom: 18px;
        }

        .card h2 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .card p {
            color: #888;
            font-size: 14px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 30px 0;
            }

            h1 {
                font-size: 32px;
            }

            .cards {
                flex-direction: column;
            }

            .card {
                min-height: 180px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Trading Dashboard</h1>

        <p class="subtitle">
            Your trading workspace
        </p>

        <div class="cards">

            <a href="Trade_Journal.html" class="card">

                <div class="icon">📊</div>

                <h2>Trade Journal</h2>

                <p>
                    Track and review your trades
                </p>

            </a>


            <a href="Trade_Plan.html" class="card">

                <div class="icon">📋</div>

                <h2>Trade Plan</h2>

                <p>
                    Review your rules before trading
                </p>

            </a>

        </div>

    </div>

</body>
</html>
